<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types hug-sw">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FBF9F6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HUG Atelier">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>HUG Atelier</title>
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="assets/js/guard.js" defer></script>
  <script src="products.js" defer></script>
  <script src="assets/js/catalog.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>
<body class="font-sans is-booting">
  <div class="aura" aria-hidden="true"></div>

  <div id="page" class="page">
  <nav id="menu" class="menu" aria-label="Categories" hidden>
    <span class="menu-glass glass" aria-hidden="true"></span>
    <button id="menu-button" type="button" class="menu-button" aria-label="Categories" aria-expanded="false" aria-controls="menu-panel">
      <span class="menu-icon" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <div id="menu-panel" class="menu-panel">
      <ul id="menu-list" class="menu-list"></ul>
      <button id="menu-all" type="button" class="menu-all">All pieces</button>
    </div>
  </nav>
  <main id="showcase" class="showcase">
    <header class="flex justify-center pt-[clamp(1.5rem,6vh,4.5rem)] pb-[clamp(1.75rem,5vh,3.5rem)]">
      <h1 id="logo" class="logo">
        <span class="logo-mark">HUG</span>
        <span class="logo-sub">Atelier</span>
      </h1>
    </header>

    <section id="stage" class="stage" aria-roledescription="carousel" aria-label="Collection">
      <div id="track" class="track"></div>
    </section>

    <footer class="caption pt-[clamp(1rem,3.2vh,2.5rem)] pb-[clamp(1.5rem,5.5vh,4rem)] px-6">
      <h2 id="caption-name" class="caption-name"></h2>
      <div class="meta">
        <span class="progress" aria-hidden="true"><span id="progress" class="progress-bar"></span></span>
        <button id="counter" type="button" class="counter" aria-label="All pieces" aria-haspopup="true"></button>
      </div>
    </footer>
    <button id="cue" type="button" class="cue" aria-label="Categories" hidden><span></span></button>
  </main>

  <div id="collections" class="collections"></div>
  </div>

  <section id="focus" class="focus" hidden aria-labelledby="piece-name">
    <figure id="media" class="media m-0">
      <img id="media-img" class="media-img" alt="" draggable="false" decoding="async">
      <img id="peek-prev" class="media-peek" data-side="-1" alt="" draggable="false" decoding="async" aria-hidden="true">
      <img id="peek-next" class="media-peek" data-side="1" alt="" draggable="false" decoding="async" aria-hidden="true">
      <canvas id="orbit" class="media-orbit" aria-hidden="true"></canvas>
      <span class="loupe" aria-hidden="true"></span>
      <span id="lens" class="lens" aria-hidden="true"><img id="lens-img" alt="" draggable="false" decoding="async"></span>
      <div id="dots" class="dots glass" hidden></div>
    </figure>

    <div id="panel" class="panel">
      <div class="ambient" aria-hidden="true"><img id="ambient-img" alt="" draggable="false" decoding="async"></div>
      <div class="panel-body">
        <p id="piece-ref" class="ref rise" hidden></p>
        <h2 id="piece-name" class="piece-name rise"></h2>
        <ul id="badges" class="badges" aria-label="Specifications"></ul>
      </div>
      <nav id="nav" class="nav fade" aria-label="Pieces">
        <button type="button" class="round glass" data-step="-1" aria-label="Previous piece">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        </button>
        <span id="focus-counter" aria-hidden="true"></span>
        <button type="button" class="round glass" data-step="1" aria-label="Next piece">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </nav>
    </div>

    <button id="back" type="button" class="back glass">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      Back
    </button>
  </section>

  <section id="index" class="index" hidden aria-label="All pieces">
    <button id="index-back" type="button" class="back glass">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      Back
    </button>
    <div id="index-groups" class="index-groups"></div>
  </section>

  <noscript><p class="fixed inset-0 grid place-items-center text-xs tracking-[0.3em] uppercase text-taupe">Turn on JavaScript to view the collection.</p></noscript>
</body>
</html>
